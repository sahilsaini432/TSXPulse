strategies:
  mean_reversion:
    enabled: true
    rsi_period: 14
    rsi_buy_below: 30
    rsi_sell_above: 70
  ma_crossover:
    enabled: true
    short_period: 50
    long_period: 200
    etfs_only: true

risk:
  max_risk_per_trade_pct: 0.02 # 2% of capital per trade
  max_concurrent_positions: 3
  max_signals_per_day: 3
  stop_loss_pct: 0.05
  take_profit_pct: 0.10
  max_daily_implied_loss_pct: 0.05

schedule:
  runs_et: ["09:15", "12:00", "15:45"]
  timezone: America/Toronto
  respect_tsx_holidays: true

broker:
  mode: manual # manual | paper | ibkr
  paper_slippage_pct: 0.001

discord:
  enabled: true
  webhook_url_env: DISCORD_WEBHOOK_URL

logging:
  level: INFO
  file: logs/runner.log
  max_bytes: 5242880 # 5 MB
  backup_count: 5

discovery:
  # LLM-driven TSX Composite discovery pipeline. Parallel to strategies — runs
  # via scripts/run_discovery.py, NOT via run_cycle.py. Set enabled: true after
  # populating ANTHROPIC_API_KEY and TAVILY_API_KEY in .env.
  enabled: true
  model: claude-sonnet-4-6 # or claude-opus-4-7 (slower, higher quality)
  max_universe: 225 # how many tickers to fetch from XIC holdings
  max_candidates: 50 # top-N from screener forwarded to ranker
  top_n: 7 # final signals returned by ranker
  max_tokens: 4000 # model response token budget
  news_per_ticker: 3 # Tavily results per candidate
  news_days_back: 7 # how recent news must be
  api_key_env: ANTHROPIC_API_KEY
  tavily_key_env: TAVILY_API_KEY
